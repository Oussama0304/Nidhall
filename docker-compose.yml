version: '3.8'

services:
  frontend:
    build:
      context: ./pfe-project-front
      dockerfile: Dockerfile
    ports:
      - "8095:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://backend:3000
      - REACT_APP_UPLOADS_URL=http://backend:3000/uploads
      - REACT_APP_PUBLIC_URL=http://backend:3000/public
    volumes:
      - ./pfe-project-front/public:/usr/share/nginx/html/public
      - uploads:/usr/share/nginx/html/uploads
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=ProjectPfeAgil
      - DB_NAME=ProjetPfeAgil
      - NODE_ENV=production
      - EMAIL_USER=nidhal.boughanmi@esprit.tn
      - EMAIL_PASS=Nidhalboughanmi123
      - HUGGINGFACE_API_KEY=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
    volumes:
      - ./uploads:/app/uploads
      - ./public:/app/public
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  database:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=ProjectPfeAgil
      - MYSQL_DATABASE=ProjetPfeAgil
      - MYSQL_ROOT_HOST=%
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./init/initStationService.sql:/docker-entrypoint-initdb.d/02-station.sql
      - ./init/initProduit.sql:/docker-entrypoint-initdb.d/03-produit.sql
      - ./init/initDepot.sql:/docker-entrypoint-initdb.d/04-depot.sql
      - ./init/initCommande.sql:/docker-entrypoint-initdb.d/05-commande.sql
      - ./init/initLivraison.sql:/docker-entrypoint-initdb.d/06-livraison.sql
      - ./init/initMaterial.sql:/docker-entrypoint-initdb.d/07-material.sql
      - ./init/initCommandeProduit.sql:/docker-entrypoint-initdb.d/08-commandeproduit.sql
      - ./init/initMouvementStock.sql:/docker-entrypoint-initdb.d/09-mouvementstock.sql
      - ./init/initReclamationData.sql:/docker-entrypoint-initdb.d/10-reclamation.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  uploads:
  mysql_data:
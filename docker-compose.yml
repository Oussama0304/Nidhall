version: '3.8'

services:
  frontend:
    image: oussama22444/frontend:latest
    ports:
      - "8098:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  backend:
    image: oussama22444/backend:latest
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root123
      - DB_NAME=ProjetPfeAgil
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=http://localhost:8098
      - JWT_SECRET=${JWT_SECRET}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=ProjetPfeAgil
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./sql/data.sql:/docker-entrypoint-initdb.d/2-data.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network

volumes:
  mysql_data:
    name: pfe_mysql_data

networks:
  app-network:
    driver: bridge

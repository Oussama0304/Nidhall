version: '3.8'

services:
  frontend:
    build:
      context: ./pfe-project-front
      dockerfile: Dockerfile
    ports:
      - "8095:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://backend:3000
      - REACT_APP_UPLOADS_URL=http://backend:3000/uploads
      - REACT_APP_PUBLIC_URL=http://backend:3000/public
    volumes:
      - ./pfe-project-front/public:/usr/share/nginx/html/public:ro
      - uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=ProjectPfeAgil
      - DB_NAME=ProjetPfeAgil
      - NODE_ENV=production
      - EMAIL_USER=nidhal.boughanmi@esprit.tn
      - EMAIL_PASS=Nidhalboughanmi123
      - HUGGINGFACE_API_KEY=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
    volumes:
      - ./uploads:/app/uploads
      - ./public:/app/public
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  database:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=ProjectPfeAgil
      - MYSQL_DATABASE=ProjetPfeAgil
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pProjectPfeAgil"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  mysql_data:
  uploads:

networks:
  app-network:
    driver: bridge
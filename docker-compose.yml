version: '3.8'

services:
  database:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=ProjectPfeAgil
      - MYSQL_DATABASE=ProjetPfeAgil
      - MYSQL_ROOT_HOST=%
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=ProjectPfeAgil
      - DB_NAME=ProjetPfeAgil
      - NODE_ENV=production
      - EMAIL_USER=nidhal.boughanmi@esprit.tn
      - EMAIL_PASS=Nidhalboughanmi123
      - HUGGINGFACE_API_KEY=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
    volumes:
      - ./uploads:/app/uploads
      - ./public:/app/public
    depends_on:
      - database
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./pfe-project-front
    ports:
      - "8095:80"
    environment:
      - NODE_ENV=production
    volumes:
      - ./pfe-project-front/public:/usr/share/nginx/html/public
      - uploads:/usr/share/nginx/html/uploads
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  uploads:
  mysql_data:
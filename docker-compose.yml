version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: pfe_database
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=ProjectPfeAgil
      - MYSQL_DATABASE=ProjetPfeAgil
      - MYSQL_USER=pfeuser
      - MYSQL_PASSWORD=ProjectPfeAgil
      - MYSQL_ROOT_HOST=%
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
      - mysql_data:/var/lib/mysql
    networks:
      app-network:
        aliases:
          - database
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: pfe_backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=ProjectPfeAgil
      - DB_NAME=ProjetPfeAgil
      - EMAIL_USER=nidhal.boughanmi@esprit.tn
      - EMAIL_PASS=Nidhalboughanmi123
      - HUGGINGFACE_API_KEY=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
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: 
      context: ./pfe-project-front
      dockerfile: Dockerfile
    container_name: pfe_pip_agil_frontend
    ports:
      - "8095:80"
    environment:
      - NODE_ENV=production
    volumes:
      - ./pfe-project-front/public:/usr/share/nginx/html/public
      - uploads:/usr/share/nginx/html/uploads
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  uploads:
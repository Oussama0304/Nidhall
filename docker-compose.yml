version: '3.8'

services:
  frontend:
    build:
      context: ./pfe-project-front
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:3000
    ports:
      - "8095:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3000
      - REACT_APP_UPLOADS_URL=http://localhost:3000/uploads
      - REACT_APP_PUBLIC_URL=http://localhost:3000/public
      - NODE_ENV=production
    volumes:
      - ./pfe-project-front/public:/usr/share/nginx/html/public
      - uploads:/usr/share/nginx/html/uploads
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=ProjectPfeAgil
      - DB_NAME=ProjetPfeAgil
      - NODE_ENV=production
      - EMAIL_USER=nidhal.boughanmi@esprit.tn
      - EMAIL_PASS=Nidhalboughanmi123
      - HUGGINGFACE_API_KEY=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
    volumes:
      - ./uploads:/app/uploads
      - ./public:/app/public
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  database:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=ProjetPfeAgil
      - MYSQL_ROOT_PASSWORD=ProjectPfeAgil
      - MYSQL_ROOT_HOST=%
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./migrations/fix_reclamation_data.sql:/docker-entrypoint-initdb.d/02-fix-data.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pProjectPfeAgil"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  uploads:
  mysql_data:
version: '3.8'

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=ProjetPfeAgil
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - app-network
    restart: always

  backend:
    image: oussama22444/backend:latest
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root123
      - DB_NAME=ProjetPfeAgil
      - DB_PORT=3306
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=http://localhost:8098
      - JWT_SECRET=your_jwt_secret_here
      - HUGGINGFACE_API_KEY=your_huggingface_key_here
      - EMAIL_USER=your_email_here
      - EMAIL_PASSWORD=your_email_password_here
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    networks:
      - app-network
    restart: always

  frontend:
    image: oussama22444/frontend:latest
    ports:
      - "8098:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
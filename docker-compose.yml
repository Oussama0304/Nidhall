version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: pfe_database
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=ProjectPfeAgil
      - MYSQL_DATABASE=ProjetPfeAgil
      - MYSQL_USER=pfeuser
      - MYSQL_PASSWORD=ProjectPfeAgil
      - MYSQL_ROOT_HOST=%
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
      - mysql_data:/var/lib/mysql
    networks:
      app-network:
        aliases:
          - database
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pfeuser", "-pProjectPfeAgil"]
      timeout: 20s
      retries: 10

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: pfe_backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_USER=pfeuser
      - DB_PASSWORD=ProjectPfeAgil
      - DB_NAME=ProjetPfeAgil
      - PORT=3000
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: 
      context: ./pfe-project-front
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:3000
        - REACT_APP_UPLOADS_URL=http://localhost:3000/uploads
        - REACT_APP_PUBLIC_URL=http://localhost:3000/public
    container_name: pfe_frontend
    ports:
      - "8095:80"
    volumes:
      - ./uploads:/usr/share/nginx/html/uploads
      - ./public:/usr/share/nginx/html/public
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  uploads: